apply plugin: 'com.android.library'

android {
    namespace = 'com.guidebee.game.engine'
    compileSdk = 37
    ndkVersion = "29.0.14206865"

    defaultConfig {
        minSdk = 21
        targetSdk = 37

        // AGP determines the ABI set to build from here, not from Application.mk's
        // own APP_ABI line (AGP overrides that per-invocation) - see
        // docs/GAMEENGINE_UPGRADE_PLAN.md Phase 1. armeabi-v7a/arm64-v8a cover all
        // real devices; x86/x86_64 (emulator-only) were dropped.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        externalNativeBuild {
            ndkBuild {
                arguments.add("APP_PLATFORM=android-21")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError = false
    }
}

dependencies {
}
