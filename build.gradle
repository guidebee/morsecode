// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    // AGP 9+ has built-in Kotlin support; only the Compose compiler plugin is needed explicitly.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.0' apply false
    // :decoder is a plain JVM module (no Android dependency), so it needs the Kotlin JVM
    // plugin explicitly - AGP's built-in Kotlin support only covers Android modules.
    id 'org.jetbrains.kotlin.jvm' version '2.4.0' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://oss.sonatype.org/content/repositories/public/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
