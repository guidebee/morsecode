plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Both build types use the production IDs in gradle.properties. Properties can
// be overridden with -P or ~/.gradle/gradle.properties. Test ads are opt-in.
def admobAppId = providers.gradleProperty('admobAppId').getOrElse('')
def admobBannerId = providers.gradleProperty('admobBannerId').getOrElse('ca-app-pub-1370558989807131/4913862806')
def useTestAds = providers.gradleProperty('admobTestAds').getOrElse('false').toBoolean()
if ((!admobAppId.isEmpty() && !admobAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}')) ||
        !admobBannerId.matches('ca-app-pub-[0-9]{16}/[0-9]{10}')) {
    throw new GradleException('Invalid AdMob app ID or banner ad unit ID.')
}
def testAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def testAdmobBannerId = 'ca-app-pub-3940256099942544/9214589741'

android {
    namespace = 'au.com.guidebee.morsetoolkit.activity'
    compileSdk = 37

    defaultConfig {
        applicationId = "au.com.guidebee.morsetool"
        minSdk = 21
        targetSdk = 37
        versionCode = 2
        versionName = "1.1"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [admobAppId: useTestAds || admobAppId.isEmpty() ? testAdmobAppId : admobAppId]
        buildConfigField 'String', 'ADMOB_BANNER_ID', '"' + (useTestAds ? testAdmobBannerId : admobBannerId) + '"'
        buildConfigField 'boolean', 'ADMOB_TEST_ADS', useTestAds.toString()
        buildConfigField 'boolean', 'ADMOB_CONFIGURED', (useTestAds || !admobAppId.isEmpty()).toString()
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Last Mobile Ads release supporting this app's minSdk 21.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    implementation project(':gameengine')
    implementation project(':decoder')

    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
